     SWK, FAST, GWW, UNP, CSX, NSC, UPS, FDX, LUV, DAL, UAL, BA, LMT, NOC,
     GD, RTX, TXT, LHX, TDG, CTAS, RSG, WM, VRSK, URI, WAB, AME, XYL, IEX,
     APD, ECL, SHW, PPG, NUE, FCX, NEM, IP, PKG, ALB, EMN, LYB, MLM, VMC,
     CF, MOS, STLD, AOS, PNR,
     # --- Utilities / REITs / Comm ---
     NEE, DUK, SO, D, AEP, EXC, XEL, ED, EIX, PEG, WEC, ES, DTE, PPL, FE,
