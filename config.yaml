    # --- Tech / IT ---
    [AAPL, MSFT, INTC, CSCO, ORCL, IBM, TXN, QCOM, ADBE, AMD, MU, HPQ, ADI,
     KLAC, LRCX, AMAT, MCHP, NTAP, AKAM, JNPR, CTSH, INTU, ADSK, SNPS, CDNS,
