     # --- Financières ---
     JPM, BAC, WFC, C, GS, MS, AXP, USB, PNC, TFC, BK, STT, SCHW, COF, MET,
     PRU, AFL, ALL, TRV, CB, AIG, PGR, CINF, GL, HIG, MMC, AON, AJG, BRO,
     RJF, TROW, BEN, IVZ, NTRS, FITB, HBAN, KEY, RF, MTB, ZION, CMA, WRB,
     SPGI, MCO, ICE, CME, NDAQ, MSCI, BLK, AMP, DFS, V, MA,
     # --- Santé ---
     JNJ, PFE, MRK, ABT, LLY, BMY, AMGN, GILD, BIIB, REGN, VRTX, UNH, CVS,
     CI, ELV, HUM, CNC, DHR, TMO, BDX, BSX, SYK, MDT, EW, ISRG, ZBH, BAX,
     A, HOLX, IDXX, RMD, COO, WAT, MTD, DGX, LH, MCK, CAH, UHS, HCA, DXCM,
     ALGN, INCY, MRNA, ABBV, ZTS,
     # --- Consommation ---
     PG, KO, PEP, WMT, COST, TGT, HD, LOW, MCD, SBUX, YUM, NKE, TJX, ROST,
     DLTR, KMB, CL, CLX, CHD, GIS, K, HSY, SJM, CPB, CAG, MKC, TSN, HRL,
     ADM, MO, PM, STZ, BF-B, TAP, MNST, EL, RL, HAS, LEN, DHI, PHM, NVR,
     MAS, WHR, F, GM, BBY, EBAY, AMZN, DIS, CMCSA, T, VZ, TMUS, CHTR, NFLX,
     ORLY, AZO, GPC, TSCO, ULTA, LULU, POOL, DPZ, CMG, BKNG, EXPE, MAR, HLT,
     # --- Énergie / Matériaux / Industrie ---
