# ============================================================
# Configuration unique du projet — AUCUNE valeur magique dans le code
# ============================================================

seed: 42

data:
  start: "2000-01-03"
  end: "2025-12-31"
  # nettoyage : un ticker est exclu si son premier prix valide est postérieur
  # à start_max, ou si sa part de NaN sur la période dépasse max_missing_pct
  start_max: "2000-03-31"
  max_missing_pct: 0.02
  raw_dir: "data/raw"
  processed_path: "data/processed/returns.parquet"
  prices_path: "data/processed/prices.parquet"
  dollar_volume_path: "data/processed/dollar_volume.parquet"
  stats_path: "data/processed/descriptive_stats.csv"
  batch_size: 40
  max_retries: 3
  # Liste FIGÉE (reproductibilité) : ~250 constituants actuels du S&P 500,
  # biais du survivant assumé et documenté (voir README, limites).
